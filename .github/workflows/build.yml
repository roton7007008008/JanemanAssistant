name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Specific Gradle 8.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    # যেকোনো নামের আপলোড করা ছবিকে নিখুঁতভাবে লোগো বানিয়ে দেওয়া
    - name: Auto Setup App Icon
      run: |
        mkdir -p app/src/main/res/drawable
        find . -maxdepth 2 -name "*.png" -exec cp {} app/src/main/res/drawable/app_icon.png \; || true
        ls -la app/src/main/res/drawable/

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JanemanAssistant-App
        path: app/build/outputs/apk/debug/*.apk
